[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aplnb"
dynamic = ["version"]
description = "APL magics for Jupyter and IPython, driving Dyalog over the RIDE protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jeremy Howard", email = "info@answer.ai"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python', 'apl', 'dyalog']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['fastcore','clikernel>=0.1.6']

[project.urls]
Repository = "https://github.com/answerdotai/aplnb"
Documentation = "https://answerdotai.github.io/aplnb"

[project.entry-points.nbdev]
aplnb = "aplnb._modidx:d"


[project.scripts]
aplnb_install = "aplnb:create_ipython_config"
aplkernel = "aplnb.kernel:main"
aplkernel-mcp = "aplnb.kernel:main_mcp"

[tool.setuptools.dynamic]
version = {attr = "aplnb.__version__"}

[tool.setuptools.packages.find]
include = ["aplnb"]

[tool.nbdev]
nbs_path = '.'
recursive = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
