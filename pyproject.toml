[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aplnb"
dynamic = ["version"]
description = "AI magic"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
authors = [{name = "Jeremy Howard", email = "info@answer.ai"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python', 'apl', 'dyalog']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['fastcore', 'pynapl-dyalog']

[project.urls]
Repository = "https://github.com/answerdotai/aplnb"
Documentation = "https://answerdotai.github.io/aplnb"

[project.entry-points.nbdev]
aplnb = "aplnb._modidx:d"


[project.scripts]
aplnb_install = "aplnb:create_ipython_config"

[tool.setuptools.dynamic]
version = {attr = "aplnb.__version__"}

[tool.setuptools.packages.find]
include = ["aplnb"]

[tool.nbdev]
nbs_path = '.'
recursive = false
