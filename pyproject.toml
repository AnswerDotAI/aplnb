[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aplnb"
dynamic = ["version"]
description = "MiniAPL in notebooks, with apl magics for Jupyter and IPython"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Jeremy Howard", email = "info@answer.ai"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python', 'apl', 'basedpl']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['fastcore', 'basedpl>=0.1.7', 'ipython']

[project.optional-dependencies]
dev = ['pytest', 'pytest-asyncio', 'fastcdp>=0.0.17', 'numpy']

[project.urls]
Repository = "https://github.com/answerdotai/aplnb"
Documentation = "https://answerdotai.github.io/aplnb"

[project.entry-points.nbdev]
aplnb = "aplnb._modidx:d"


[project.scripts]
aplnb_install = "aplnb:create_ipython_config"

[tool.setuptools.dynamic]
version = {attr = "aplnb.__version__"}

[tool.setuptools.packages.find]
include = ["aplnb"]

[tool.setuptools.package-data]
aplnb = ["*.js"]

[tool.nbdev]
nbs_path = '.'
recursive = false
tst_flags = 'dyalog'
